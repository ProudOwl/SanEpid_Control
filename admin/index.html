<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanEpid Control — Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef5f9;
            --bg-soft: #f8fbfd;
            --surface: #ffffff;
            --surface-alt: #f0f7fb;
            --border: #c8dce8;
            --border-strong: #9ec4d8;
            --text: #123047;
            --muted: #5b7a8f;
            --primary: #0077b6;
            --primary-dark: #005f92;
            --primary-soft: #e3f2fa;
            --medical: #00a896;
            --medical-soft: #e6f7f4;
            --danger: #d62839;
            --danger-soft: #fdecee;
            --warning: #e09f3e;
            --warning-soft: #fff6e8;
            --success: #2a9d8f;
            --success-soft: #e8f7f4;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(18, 48, 71, 0.08);
            --font: "Manrope", "Segoe UI", system-ui, sans-serif;
        }
        
        [data-theme="dark"] {
            --bg: #0d1b24;
            --bg-soft: #122331;
            --surface: #162636;
            --surface-alt: #1a2d3d;
            --border: #2a4558;
            --border-strong: #3d6278;
            --text: #e8f2f8;
            --muted: #8fb0c4;
            --primary-soft: #123248;
            --medical-soft: #123530;
            --danger-soft: #3a1520;
            --warning-soft: #3a2a12;
            --success-soft: #123530;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font);
            background: linear-gradient(180deg, #e8f3f9 0%, #f5fafc 45%, #edf4f8 100%);
            color: var(--text);
            min-height: 100vh;
        }
        
        [data-theme="dark"] body {
            background: linear-gradient(180deg, #0a1520 0%, #0d1b24 50%, #101f2a 100%);
        }
        
        .admin-container { display: flex; min-height: 100vh; }
        
        .admin-sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--medical));
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: white;
            font-size: 1.2rem;
        }
        
        .logo h1 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        
        .logo p {
            font-size: 0.7rem;
            color: var(--muted);
        }
        
        .admin-nav {
            padding: 0 0.75rem;
        }
        
        .admin-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            color: var(--muted);
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        .admin-nav a:hover {
            background: var(--primary-soft);
            color: var(--primary-dark);
        }
        
        .admin-nav a.active {
            background: linear-gradient(135deg, var(--primary), var(--medical));
            color: white;
        }
        
        .nav-icon { font-size: 1.2rem; width: 24px; }
        .nav-divider { margin: 1rem 0; border-color: var(--border); }
        
        .admin-main {
            flex: 1;
            margin-left: 280px;
            padding: 1.5rem;
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .admin-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
        
        .admin-user {
            text-align: right;
        }
        
        .admin-user span {
            display: block;
        }
        
        .admin-name {
            font-weight: 700;
            color: var(--text);
        }
        
        .admin-role {
            font-size: 0.75rem;
            color: var(--medical);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .stat-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--medical));
        }
        
        .stat-card.danger::before { background: var(--danger); }
        .stat-card.warning::before { background: var(--warning); }
        
        .stat-card .num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
        }
        
        .stat-card.danger .num { color: var(--danger); }
        .stat-card.warning .num { color: var(--warning); }
        
        .stat-card .label {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 0.35rem;
            font-weight: 600;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow);
        }
        
        .card h3 {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
        }
        
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .table-wrapper { overflow-x: auto; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            color: var(--muted);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: var(--surface-alt);
        }
        
        tr:hover td { background: rgba(0, 119, 182, 0.03); }
        
        .badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 800;
        }
        
        .badge-success { background: var(--success-soft); color: var(--success); }
        .badge-danger { background: var(--danger-soft); color: var(--danger); }
        .badge-warning { background: var(--warning-soft); color: var(--warning); }
        .badge-info { background: var(--primary-soft); color: var(--primary); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            transition: 0.15s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--medical));
            color: white;
        }
        
        .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.03); }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-secondary {
            background: var(--surface);
            color: var(--primary-dark);
            border: 1px solid var(--border-strong);
        }
        
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.75rem; }
        
        .form-group { margin-bottom: 1rem; }
        
        .form-group label {
            display: block;
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 0.35rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        
        /* Terminal styles */
        .terminal-led {
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.25rem;
            transition: 0.35s ease;
            border: 2px solid var(--border);
        }
        
        .terminal-led.idle { background: var(--surface-alt); }
        .terminal-led.green { background: var(--success-soft); border-color: var(--success); box-shadow: 0 0 24px rgba(42,157,143,.25); }
        .terminal-led.red { background: var(--danger-soft); border-color: var(--danger); box-shadow: 0 0 24px rgba(214,40,57,.25); animation: shake 0.4s ease; }
        
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .led-icon { font-size: 2.5rem; font-weight: 800; }
        .led-text { font-size: 1rem; font-weight: 800; margin-top: 0.35rem; letter-spacing: 0.04em; }
        
        .pass-result {
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 600;
        }
        
        .pass-result.allowed { background: var(--success-soft); border: 1px solid var(--success); color: var(--success); }
        .pass-result.denied { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger); }
        
        .precheck-result {
            margin-top: 1rem;
        }
        
        .check-list {
            list-style: none;
            margin: 0.75rem 0;
        }
        
        .check-list li {
            padding: 0.55rem 0.75rem;
            border-radius: 10px;
            margin-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        
        .check-list li.ok { background: var(--success-soft); color: var(--success); }
        .check-list li.bad { background: var(--danger-soft); color: var(--danger); }
        
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 1000;
            font-weight: 600;
        }
        
        .toast.success { border-color: var(--success); color: var(--success); background: var(--success-soft); }
        .toast.error { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
        .toast.hidden { display: none; }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        
        .modal.hidden { display: none; }
        
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: hidden;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .modal-body { padding: 1rem; overflow-y: auto; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--muted);
        }
        
        .loading { text-align: center; padding: 2rem; color: var(--muted); }
        .empty { text-align: center; padding: 2rem; color: var(--muted); }
        
        .theme-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.4rem 0.65rem;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .admin-sidebar { width: 70px; }
            .admin-sidebar .logo h1, .admin-sidebar .logo p, .admin-sidebar .nav-icon + span { display: none; }
            .admin-main { margin-left: 70px; }
            .admin-nav a { justify-content: center; }
            .nav-icon { margin: 0; }
        }
        
        body.kiosk-mode .admin-sidebar,
        body.kiosk-mode .admin-header .admin-user,
        body.kiosk-mode .theme-btn {
            display: none !important;
        }
        
        body.kiosk-mode .admin-main {
            margin-left: 0;
            padding: 1rem;
        }
        
        body.kiosk-mode .terminal-led {
            padding: 2.5rem;
        }
        
        body.kiosk-mode .led-icon {
            font-size: 4rem;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🏥</div>
                    <div>
                        <h1>SanEpid Control</h1>
                        <p>Admin Panel</p>
                    </div>
                </div>
            </div>
            <nav class="admin-nav">
                <a href="#" data-view="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>Дашборд</span>
                </a>
                <a href="#" data-view="terminal">
                    <span class="nav-icon">🚪</span>
                    <span>Терминал прохода</span>
                </a>
                <a href="#" data-view="users">
                    <span class="nav-icon">👥</span>
                    <span>Пользователи</span>
                </a>
                <a href="#" data-view="employees">
                    <span class="nav-icon">👨‍⚕️</span>
                    <span>Сотрудники</span>
                </a>
                <a href="#" data-view="zones">
                    <span class="nav-icon">🏥</span>
                    <span>Зоны доступа</span>
                </a>
                <a href="#" data-view="permissions">
                    <span class="nav-icon">🔑</span>
                    <span>Допуски</span>
                </a>
                <a href="#" data-view="documents">
                    <span class="nav-icon">📋</span>
                    <span>Документы</span>
                </a>
                <a href="#" data-view="registrations">
                    <span class="nav-icon">📝</span>
                    <span>Заявки</span>
                </a>
                <a href="#" data-view="incidents">
                    <span class="nav-icon">⚠️</span>
                    <span>Инциденты</span>
                </a>
                <a href="#" data-view="access-logs">
                    <span class="nav-icon">📊</span>
                    <span>Журнал проходов</span>
                </a>
                <a href="#" data-view="audit">
                    <span class="nav-icon">📋</span>
                    <span>Аудит</span>
                </a>
                <a href="#" data-view="settings">
                    <span class="nav-icon">⚙️</span>
                    <span>Настройки</span>
                </a>
                <a href="#" data-view="system">
                    <span class="nav-icon">💻</span>
                    <span>Система</span>
                </a>
                <hr class="nav-divider">
                <a href="/" target="_blank">
                    <span class="nav-icon">🏠</span>
                    <span>Основной сайт</span>
                </a>
                <a href="#" id="logout-btn">
                    <span class="nav-icon">🚪</span>
                    <span>Выход</span>
                </a>
            </nav>
        </aside>
        <main class="admin-main">
            <div class="admin-header">
                <h1 id="page-title">Панель управления</h1>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div class="admin-user">
                        <span class="admin-name" id="admin-name">Загрузка...</span>
                        <span class="admin-role">Администратор</span>
                    </div>
                    <button class="theme-btn" id="theme-toggle" title="Тема">🌙</button>
                </div>
            </div>
            <div id="view-content">
                <div class="loading">Загрузка...</div>
            </div>
        </main>
    </div>
    <div id="toast" class="toast hidden"></div>
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" id="modal-save">Сохранить</button>
            </div>
        </div>
    </div>
    
    <script src="/admin/admin.js"></script>
</body>
</html>
